<h2>Task List</h2>

<!-- 任務列表 -->
<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>Title</th>
      <th>Assignee</th>
      <th>Status</th>
      <th>Due Date</th>
    </tr>
  </thead>

  <tbody>
    <!-- 使用 *ngFor 產生任務列表 -->
    <tr *ngFor="let task of tasks">
      <td>{{ task.title }}</td>
      <td>{{ task.assignee }}</td>
      <td>{{ task.status }}</td>
      <td>{{ task.dueDate }}</td>
    </tr>
  </tbody>
</table>
