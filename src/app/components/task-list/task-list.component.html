<h2>任務列表</h2>

<!-- 任務列表 -->
<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>任務名稱</th>
      <th>負責人</th>
      <th>狀態</th>
      <th>截止日期</th>
    </tr>
  </thead>

  <tbody>
    <!-- 使用 *ngFor 產生任務列表 -->
    <tr *ngFor="let task of tasks">
      <td>{{ task.title }}</td>
      <td>{{ task.assignee }}</td>
      <td>{{ task.status }}</td>
      <td>{{ task.dueDate }}</td>
    </tr>
  </tbody>
</table>
